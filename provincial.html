<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tablero Energético - Perú</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; height: 100dvh; overflow: hidden; background: #0f172a; position: relative; }

    /* PANEL LATERAL */
    #sidebar {
      width: 380px;
      padding: 22px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    }

    #map { flex: 1; height: 100%; background: #e2e8f0; }

    .header-tag { font-size: 0.75rem; font-weight: 700; color: #2563eb; text-transform: uppercase; }
    h1 { font-size: 1.25rem; color: #0f172a; margin-top: 3px; }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    /* SELECTOR DE NIVEL TERRITORIAL (DISTRITAL / PROVINCIAL) */
    .level-toggle {
      display: flex;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }
    .toggle-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 13px;
    }

    .kpi-title { font-size: 0.72rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
    .kpi-value { font-size: 1.6rem; font-weight: 700; color: #0f172a; margin-top: 4px; }
    .kpi-sub { font-size: 0.8rem; color: #64748b; margin-top: 2px; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.82rem; font-weight: 600; color: #334155; }
    select, input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.92rem;
      background: #ffffff;
      outline: none;
    }
    select:focus, input:focus { border-color: #2563eb; }

    .legend-bar {
      display: flex;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin: 8px 0 4px 0;
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #64748b;
    }

    /* ELEMENTOS PARA CELULARES */
    .mobile-toggle-btn { display: none; }
    .mobile-close-btn { display: none; }
    .btn-close-header { display: none; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #map { width: 100vw; height: 100vh; height: 100dvh; z-index: 1; }

      #sidebar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 85vh;
        height: 85dvh;
        border-right: none;
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -8px 24px rgba(0,0,0,0.25);
        z-index: 2000;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 20px;
      }

      #sidebar.open { transform: translateY(0); }

      .mobile-toggle-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1500;
        background: #0f172a;
        color: #ffffff;
        border: none;
        padding: 12px 22px;
        border-radius: 50px;
        font-size: 0.95rem;
        font-weight: 700;
        box-shadow: 0 4px 18px rgba(0,0,0,0.35);
        cursor: pointer;
      }

      .btn-close-header {
        display: block;
        background: transparent;
        border: none;
        font-size: 1.6rem;
        color: #64748b;
        cursor: pointer;
      }

      .mobile-close-btn {
        display: block;
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Botón flotante móvil -->
  <button class="mobile-toggle-btn" id="mobile-toggle">
    📊 Filtros y Estadísticas
  </button>

  <!-- Panel Lateral -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div>
        <span class="header-tag">Censo de Vivienda</span>
        <h1>Electrificación en Perú 🇵🇪</h1>
      </div>
      <button class="btn-close-header" id="btn-close-x" title="Cerrar">✕</button>
    </div>

    <!-- Selector Distrital / Provincial -->
    <div class="form-group">
      <label>Nivel Territorial</label>
      <div class="level-toggle">
        <button type="button" class="toggle-btn active" id="btn-distrital">🏢 Distrital</button>
        <button type="button" class="toggle-btn" id="btn-provincial">🗺️ Provincial</button>
      </div>
    </div>

    <!-- Indicador KPI -->
    <div class="card">
      <div class="kpi-title" id="kpi-label">Promedio de Cobertura</div>
      <div class="kpi-value" id="kpi-main">-- %</div>
      <div class="kpi-sub" id="kpi-detail">Cargando territorio...</div>
    </div>

    <!-- Selector de Indicador -->
    <div class="form-group">
      <label for="metric-select">Variable a Visualizar</label>
      <select id="metric-select">
        <option value="Pct Red pública">Acceso a Red Pública (%)</option>
        <option value="PCT Sin energía">Sin Energía Eléctrica (%)</option>
        <option value="PCT Energías limpias">Energías Limpias / Paneles (%)</option>
      </select>
    </div>

    <!-- Filtro por Departamento -->
    <div class="form-group">
      <label for="dept-select">Filtrar Departamento</label>
      <select id="dept-select">
        <option value="TODOS">Todo el Perú</option>
      </select>
    </div>

    <!-- Buscador por texto -->
    <div class="form-group">
      <label for="search-input" id="search-label">Buscar Distrito o Provincia</label>
      <input type="text" id="search-input" placeholder="Ej. Chachapoyas, Bagua..." />
    </div>

    <!-- Leyenda de colores -->
    <div class="card">
      <div class="kpi-title">Escala de Valor</div>
      <div class="legend-bar" id="legend-bar" style="background: linear-gradient(to right, #ef4444, #eab308, #15803d);"></div>
      <div class="legend-labels">
        <span>0%</span>
        <span>50%</span>
        <span>100%</span>
      </div>
    </div>

    <button class="mobile-close-btn" id="mobile-close-action">🗺️ Ver en el Mapa</button>

    <div style="font-size:0.75rem; color:#94a3b8; margin-top:auto;">
      Datos INEI procesados con agregación ponderada automática.
    </div>
  </aside>

  <!-- Área del Mapa -->
  <main id="map"></main>

  <!-- Librerías Leaflet y PapaParse -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const isMobile = window.innerWidth <= 768;
    const map = L.map('map').setView([-9.19, -75.01], isMobile ? 5 : 6);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 16
    }).addTo(map);

    let currentLevel = 'distrital'; // 'distrital' | 'provincial'
    let geojsonLayer = null;

    let distritosGeo = null;
    let provinciasGeo = null;

    let datosDistrito = {};
    let datosProvincia = {};
    let listaDepartamentos = new Set();

    // Paletas de color por métrica
    function getColor(value, metric) {
      if (metric === "Pct Red pública") {
        return value > 90 ? '#15803d' :
               value > 75 ? '#22c55e' :
               value > 50 ? '#eab308' :
               value > 25 ? '#f97316' : '#ef4444';
      } else if (metric === "PCT Sin energía") {
        return value > 40 ? '#7f1d1d' :
               value > 25 ? '#dc2626' :
               value > 15 ? '#f97316' :
               value > 5  ? '#facc15' : '#10b981';
      } else {
        return value > 40 ? '#047857' :
               value > 20 ? '#10b981' :
               value > 10 ? '#34d399' :
               value > 2  ? '#6ee7b7' : '#cbd5e1';
      }
    }

    function getFeatureData(feature) {
      if (currentLevel === 'distrital') {
        const ubi = feature.properties.IDDIST || feature.properties.UBIGEO;
        return datosDistrito[ubi];
      } else {
        const ubi = feature.properties.IDPROV || feature.properties.UBIGEO;
        return datosProvincia[ubi];
      }
    }

    function style(feature) {
      const data = getFeatureData(feature);
      const metric = document.getElementById('metric-select').value;
      const val = data ? (parseFloat(data[metric]) || 0) : 0;

      return {
        fillColor: getColor(val, metric),
        weight: currentLevel === 'provincial' ? 1.5 : 0.8,
        opacity: 0.9,
        color: '#ffffff',
        fillOpacity: 0.82
      };
    }

    function actualizarKPIs() {
      const metric = document.getElementById('metric-select').value;
      const dept = document.getElementById('dept-select').value;
      const query = document.getElementById('search-input').value.toLowerCase();

      const dataset = currentLevel === 'distrital' ? datosDistrito : datosProvincia;
      let sum = 0, count = 0, maxVal = -1, maxEntity = "";

      Object.values(dataset).forEach(d => {
        if (dept !== "TODOS" && d.Departamento !== dept) return;

        const nameMatch = currentLevel === 'distrital'
          ? (d.Distrito.toLowerCase().includes(query) || d.Provincia.toLowerCase().includes(query))
          : (d.Provincia.toLowerCase().includes(query));

        if (query && !nameMatch) return;

        const val = parseFloat(d[metric]) || 0;
        sum += val;
        count++;
        if (val > maxVal) {
          maxVal = val;
          maxEntity = currentLevel === 'distrital' ? `${d.Distrito} (${d.Provincia})` : `${d.Provincia} (${d.Departamento})`;
        }
      });

      const avg = count > 0 ? (sum / count).toFixed(1) : 0;
      document.getElementById('kpi-main').textContent = `${avg}%`;
      document.getElementById('kpi-detail').textContent = count > 0 
        ? `Máximo: ${maxVal.toFixed(1)}% en ${maxEntity}`
        : 'Sin registros coincidentes';
    }

    function aplicarFiltros() {
      if (!geojsonLayer) return;
      const dept = document.getElementById('dept-select').value;
      const query = document.getElementById('search-input').value.toLowerCase();

      let bounds = L.latLngBounds();
      let hasVisible = false;

      geojsonLayer.eachLayer(layer => {
        const d = getFeatureData(layer.feature);
        let visible = true;

        if (d) {
          if (dept !== "TODOS" && d.Departamento !== dept) visible = false;

          const nameMatch = currentLevel === 'distrital'
            ? (d.Distrito.toLowerCase().includes(query) || d.Provincia.toLowerCase().includes(query))
            : (d.Provincia.toLowerCase().includes(query));

          if (query && !nameMatch) visible = false;
        } else {
          visible = false;
        }

        if (visible) {
          layer.setStyle(style(layer.feature));
          bounds.extend(layer.getBounds());
          hasVisible = true;
        } else {
          layer.setStyle({ fillOpacity: 0, opacity: 0 });
        }
      });

      if (hasVisible && dept !== "TODOS") {
        map.fitBounds(bounds, { padding: [30, 30] });
      } else if (dept === "TODOS" && !query) {
        map.setView([-9.19, -75.01], isMobile ? 5 : 6);
      }

      actualizarKPIs();
    }

    function renderizarCapa() {
      if (geojsonLayer) {
        map.removeLayer(geojsonLayer);
      }

      const geoSource = currentLevel === 'distrital' ? distritosGeo : provinciasGeo;

      geojsonLayer = L.geoJson(geoSource, {
        style: style,
        onEachFeature: function(feature, layer) {
          const d = getFeatureData(feature);
          if (d) {
            const titulo = currentLevel === 'distrital' ? d.Distrito : `Prov. ${d.Provincia}`;
            const subtitulo = currentLevel === 'distrital' ? `${d.Provincia}, ${d.Departamento}` : d.Departamento;

            layer.bindPopup(`
              <div style="font-size:0.9rem; line-height:1.4;">
                <strong style="font-size:1.05rem; color:#0f172a;">${titulo}</strong><br/>
                <span style="color:#64748b;">${subtitulo}</span>
                <hr style="margin:8px 0; border:0; border-top:1px solid #e2e8f0;"/>
                <div>⚡ <strong>Red pública:</strong> ${d['Pct Red pública']}%</div>
                <div>☀️ <strong>Energías limpias:</strong> ${d['PCT Energías limpias']}%</div>
                <div>⚠️ <strong>Sin electricidad:</strong> ${d['PCT Sin energía']}%</div>
                <div style="margin-top:6px; font-size:0.75rem; color:#64748b;">Viviendas analizadas: ${Number(d.Total).toLocaleString('es-PE')}</div>
              </div>
            `);
          }
        }
      }).addTo(map);

      aplicarFiltros();
    }

    // Cambiar nivel territorial
    async function cambiarNivel(nuevoNivel) {
      if (currentLevel === nuevoNivel) return;
      currentLevel = nuevoNivel;

      document.getElementById('btn-distrital').classList.toggle('active', currentLevel === 'distrital');
      document.getElementById('btn-provincial').classList.toggle('active', currentLevel === 'provincial');

      document.getElementById('search-label').textContent = currentLevel === 'distrital' 
        ? 'Buscar Distrito o Provincia' 
        : 'Buscar Provincia';
      document.getElementById('search-input').placeholder = currentLevel === 'distrital' 
        ? 'Ej. Chachapoyas, Bagua...' 
        : 'Ej. Santa, Maynas, Cusco...';

      // Cargar GeoJSON provincial bajo demanda si aún no está en memoria
      if (currentLevel === 'provincial' && !provinciasGeo) {
        document.getElementById('kpi-detail').textContent = 'Descargando cartografía provincial...';
        const resProv = await fetch("https://raw.githubusercontent.com/juaneladio/peru-geojson/master/peru_provincial_simple.geojson");
        provinciasGeo = await resProv.json();

        // Normalizar claves de provincia
        provinciasGeo.features.forEach(f => {
          let rawUbi = String(f.properties.IDPROV || f.properties.UBIGEO || f.properties.FIRST_IDPR || '').trim();
          let ubi = rawUbi.length >= 4 ? rawUbi.substring(0, 4).padStart(4, '0') : rawUbi.padStart(4, '0');
          if (ubi.startsWith('26') || ubi.startsWith('27')) ubi = '15' + ubi.substring(2);
          f.properties.IDPROV = ubi;
          f.properties.UBIGEO = ubi;
        });
      }

      renderizarCapa();
    }

    // Inicialización del Tablero
    async function inicializarTablero() {
      try {
        // Carga de cartografía distrital
        const resGeo = await fetch("https://raw.githubusercontent.com/juaneladio/peru-geojson/master/peru_distrital_simple.geojson");
        distritosGeo = await resGeo.json();

        // Normalizar GeoJSON distrital
        distritosGeo.features.forEach(f => {
          let ubi = String(f.properties.IDDIST || f.properties.UBIGEO || '').trim().padStart(6, '0');
          if (ubi === '160109') ubi = '160801';
          if (ubi === '160114') ubi = '160803';
          f.properties.IDDIST = ubi;
          f.properties.UBIGEO = ubi;
        });

        // Lectura y agregación de datos CSV
        Papa.parse("base_energia_viviendas.csv", {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            const agrupadorProvincial = {};

            results.data.forEach(row => {
              if (!row.UBIGEO) return;

              let ubiDist = String(row.UBIGEO).trim().padStart(6, '0');
              if (ubiDist.startsWith('26') || ubiDist.startsWith('27')) {
                ubiDist = '15' + ubiDist.substring(2);
              }

              const dep = row.Departamento ? row.Departamento.trim() : '';
              const prov = row.Provincia ? row.Provincia.trim() : '';
              const dist = row.Distrito ? row.Distrito.trim() : '';

              const red = parseFloat(String(row['Red pública'] || '0').replace(/[\s,]/g, '')) || 0;
              const panel = parseFloat(String(row['Panel solar / batería'] || '0').replace(/[\s,]/g, '')) || 0;
              const eolica = parseFloat(String(row['Energía eólitica (viento)'] || '0').replace(/[\s,]/g, '')) || 0;
              const sin = parseFloat(String(row['No tiene energía eléctrica'] || '0').replace(/[\s,]/g, '')) || 0;
              const tot = parseFloat(String(row.Total || '0').replace(/[\s,]/g, '')) || 0;

              // 1. Guardar a nivel Distrital
              datosDistrito[ubiDist] = {
                UBIGEO: ubiDist,
                Departamento: dep,
                Provincia: prov,
                Distrito: dist,
                'Pct Red pública': row['Pct Red pública'],
                'PCT Sin energía': row['PCT Sin energía'],
                'PCT Energías limpias': row['PCT Energías limpias'],
                Total: tot
              };

              if (dep) listaDepartamentos.add(dep);

              // 2. Acumular a nivel Provincial (primeros 4 dígitos)
              const ubiProv = ubiDist.substring(0, 4);
              if (!agrupadorProvincial[ubiProv]) {
                agrupadorProvincial[ubiProv] = {
                  UBIGEO: ubiProv,
                  Departamento: dep,
                  Provincia: prov,
                  red: 0,
                  limpias: 0,
                  sin: 0,
                  total: 0
                };
              }
              agrupadorProvincial[ubiProv].red += red;
              agrupadorProvincial[ubiProv].limpias += (panel + eolica);
              agrupadorProvincial[ubiProv].sin += sin;
              agrupadorProvincial[ubiProv].total += tot;
            });

            // Calcular porcentajes consolidados para cada provincia
            Object.keys(agrupadorProvincial).forEach(k => {
              const p = agrupadorProvincial[k];
              const t = p.total > 0 ? p.total : 1;
              datosProvincia[k] = {
                UBIGEO: k,
                Departamento: p.Departamento,
                Provincia: p.Provincia,
                'Pct Red pública': ((p.red / t) * 100).toFixed(2),
                'PCT Sin energía': ((p.sin / t) * 100).toFixed(2),
                'PCT Energías limpias': ((p.limpias / t) * 100).toFixed(2),
                Total: p.total
              };
            });

            // Poblar menú desplegable de departamentos
            const deptSelect = document.getElementById('dept-select');
            Array.from(listaDepartamentos).sort().forEach(dep => {
              const opt = document.createElement('option');
              opt.value = dep;
              opt.textContent = dep;
              deptSelect.appendChild(opt);
            });

            renderizarCapa();
          }
        });
      } catch (err) {
        console.error("Error al inicializar tablero:", err);
      }
    }

    // Eventos
    document.getElementById('btn-distrital').addEventListener('click', () => cambiarNivel('distrital'));
    document.getElementById('btn-provincial').addEventListener('click', () => cambiarNivel('provincial'));

    document.getElementById('metric-select').addEventListener('change', () => {
      geojsonLayer.setStyle(style);
      actualizarKPIs();
    });
    document.getElementById('dept-select').addEventListener('change', aplicarFiltros);
    document.getElementById('search-input').addEventListener('input', aplicarFiltros);

    // Controles táctiles móviles
    const sidebar = document.getElementById('sidebar');
    document.getElementById('mobile-toggle').addEventListener('click', () => sidebar.classList.add('open'));
    document.getElementById('btn-close-x').addEventListener('click', () => sidebar.classList.remove('open'));
    document.getElementById('mobile-close-action').addEventListener('click', () => sidebar.classList.remove('open'));

    inicializarTablero();
  </script>
</body>
</html>
